name: Copiar web de Shopify
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python build.py
      - name: Publicar en la rama deploy
        run: |
          cd site
          git init -q -b deploy
          git config user.name "vialab-bot"
          git config user.email "bot@vialabacademy.com"
          git add -A
          git commit -qm "Web $(date -u +%F-%H%M)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" deploy
